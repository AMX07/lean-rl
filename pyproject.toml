[project]
name = "lean-rl"
version = "0.1.0"
description = "Lean verifier RL environment, evaluation tools, and regression tests"
requires-python = ">=3.11,<3.14"
dependencies = ["lean-verifier-env"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "build>=1,<2"]

[tool.uv.sources]
lean-verifier-env = {path = "vendor/lean-verifier-env", editable = true}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["lean: requires local Lean and REPL binaries"]
